[package]
name = "mathdrill"
version = "0.2.0"
authors = ["Tyler Colby"]
edition = "2021"
description = "Timed arithmetic quiz for Precursor with TRNG-generated problems and saved best scores"
license = "Apache-2.0"

# Lives at xous-core/apps/mathdrill/ (see xous-dev-toolkit/bin/integrate).
[dependencies]
log = "0.4.14"
num-derive = { version = "0.4.2", default-features = false }
num-traits = { version = "0.2.14", default-features = false }
xous = "0.9.71"
log-server = { package = "xous-api-log", version = "0.1.70" }
xous-names = { package = "xous-api-names", version = "0.9.72" }
ticktimer-server = { package = "xous-api-ticktimer", version = "0.9.71" }
gam = { path = "../../services/gam" }
precursor-appkit = { path = "../../libs/precursor-appkit" }
mathdrill-core = { path = "core" }

[features]
default = []
